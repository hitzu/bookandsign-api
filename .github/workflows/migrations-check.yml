name: migrations-check

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: migrations-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  migration-chain:
    name: migration chain builds from empty
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_VERSION: 22
      PNPM_VERSION: 9
      # `ci` is not `test`, so the DataSource loads the migration glob and keeps
      # `synchronize` off. No `.env.ci` exists in the repo, so these values win.
      NODE_ENV: ci
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: bookandsign_migrations_check
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bookandsign_migrations_check
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node (+ pnpm cache)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the full migration chain against an empty database
        run: pnpm run db:run

      - name: Show applied migrations
        run: pnpm run db:status

      - name: Verify the schema converges with the entity model
        run: |
          set +e
          output=$(pnpm run db:gen 2>&1)
          set -e
          echo "$output"
          if echo "$output" | grep -q "No changes in database schema were found"; then
            echo "::notice::Migration-built schema matches the entity model."
            exit 0
          fi
          echo "::error::The migration chain and the entity model disagree. \
          A migration was generated against a database that the chain had just \
          built, which means the two paths to the schema have diverged. \
          Run 'pnpm run db:gen' locally and add the missing migration."
          exit 1
